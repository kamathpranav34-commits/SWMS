<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulation · SWMS</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<style>
  .range-row{display:flex; align-items:center; gap:10px;}
  .range-row input[type=range]{flex:1; margin-bottom:0;}
  .range-row .range-val{font-family:var(--font-mono); color:var(--amber); width:34px; text-align:right;}
  .sim-list button{
    width:100%; text-align:left; padding:9px 11px; margin-bottom:6px;
    border:1px solid var(--line); background:var(--panel-raised); color:var(--bone);
    border-radius:var(--radius); cursor:pointer; font-size:12.5px;
  }
  .sim-list button.current{border-color:var(--amber);}
  .chart-wrap{position:relative; height:300px; margin-bottom:24px;}
  .table-scroll{max-height:340px; overflow:auto; border:1px solid var(--line-soft); border-radius:var(--radius);}
</style>
</head>
<body>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>const CONTENT = renderShell('simulation.html');</script>

<template id="tpl">
  <div class="page-head">
    <h1>Simulation</h1>
    <p class="sub">Forecast waste generation, treatment, cost and emissions across a planning horizon of up to twenty years. Enter a calendar year such as 2026 as the simulation start year.</p>
  </div>

  <div class="grid-2" style="align-items:start;">
    <div class="panel tick-frame">
      <h3>Configure a run</h3>
      <form id="sim-form">
        <label for="sim-name">Simulation name</label>
        <input type="text" id="sim-name" placeholder="Baseline 20 Year" required>
        <label for="sim-start">Start year</label>
        <input type="number" id="sim-start" value="2026" min="1900" max="2100" step="1" required>
        <label for="sim-duration">Duration — <span class="range-val" id="dur-val">20</span> years</label>
        <div class="range-row">
          <input type="range" id="sim-duration" min="2" max="20" value="20">
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%; justify-content:center; margin-top:6px;">Run simulation</button>
      </form>
      <hr class="hr-soft">
      <h4 style="font-size:13px; color:var(--ash);">Past runs</h4>
      <div class="sim-list" id="sim-list"></div>
    </div>

    <div class="panel tick-frame" id="results-panel">
      <div class="empty-state" id="empty-results">
        <h3>No results yet</h3>
        <p>Configure and run a simulation to see the forecast.</p>
      </div>
    </div>
  </div>
</template>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="js/simulation.js"></script>
</body>
</html>
